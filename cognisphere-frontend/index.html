<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Inline SVG data-URI favicon: a simple indigo "C" mark. Using a data
      URI means there's no /public/favicon.ico dependency that could 404 —
      TenantContext.jsx overrides this at runtime with the tenant's own
      logo (branding.faviconUrl) once it loads, via the same #favicon id.
    -->
    <link
      id="favicon"
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234F46E5'/%3E%3Ctext x='50' y='68' font-family='Arial, sans-serif' font-size='58' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogniSphere - Multi-Tenant Learning Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
